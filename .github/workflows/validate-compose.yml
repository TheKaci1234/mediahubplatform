
name: Validate MediaHub

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Docker Compose configuration
        env:
          MUSIC_DIR: /tmp/mediahub-music
          RESTIC_REPOSITORY_PATH: /tmp/mediahub-restic
          RESTIC_PASSWORD_FILE: /tmp/mediahub-restic-password
        run: |
          docker compose version
          docker compose config -q
