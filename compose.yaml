services:
  navidrome:
    image: deluan/navidrome:latest
    user: "1000:1000"
    ports:
      - "4533:4533"
    restart: unless-stopped
    environment:
      ND_LOGLEVEL: info
      ND_MUSICFOLDER: /music
      ND_DATAFOLDER: /data
    volumes:
      - "./services/navidrome/data:/data"
      - "${MUSIC_DIR:?Set MUSIC_DIR in .env}:/music:ro"
