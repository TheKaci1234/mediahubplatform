global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: navidrome
    metrics_path: /metrics_mediahub
    static_configs:
      - targets: ["navidrome:4533"]

  - job_name: jellyfin
    metrics_path: /metrics
    static_configs:
      - targets: ["jellyfin:8096"]
